name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint


  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm run test


  build-and-push:
    name: Frontend Build and Push
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify backend URL
        env:
          REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL }}
        run: |
          if [ -z "${REACT_APP_MOVIE_API_URL}" ]; then
            echo "::error::REACT_APP_MOVIE_API_URL repository variable is not configured."
            exit 1
          fi

          echo "Frontend backend URL: ${REACT_APP_MOVIE_API_URL}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Remove trailing slash if one was entered in the GitHub variable.
          REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL%/}"

          echo "Building frontend with backend URL:"
          echo "${REACT_APP_MOVIE_API_URL}"

          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag "${IMAGE}" \
            starter/frontend

          docker push "${IMAGE}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"


  deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name cluster \
            --region us-east-1

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Deploy frontend
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          cd starter/frontend/k8s

          echo "===== IMAGE ====="
          echo "${IMAGE}"

          kustomize edit set image frontend="${IMAGE}"

          echo "===== KUSTOMIZE OUTPUT ====="
          kustomize build

          echo "===== APPLY ====="
          kustomize build | kubectl apply -f -

          echo "===== NODES ====="
          kubectl get nodes -o wide || true

          echo "===== PODS BEFORE ROLLOUT ====="
          kubectl get pods -o wide || true

          if ! kubectl rollout status deployment/frontend --timeout=300s; then
            echo "===== FRONTEND PODS ====="
            kubectl get pods -l app=frontend -o wide || true

            echo "===== FRONTEND DEPLOYMENT ====="
            kubectl describe deployment frontend || true

            echo "===== FRONTEND POD DETAILS ====="
            kubectl describe pods -l app=frontend || true

            echo "===== FRONTEND LOGS ====="
            kubectl logs -l app=frontend --all-containers --tail=100 || true

            echo "===== EVENTS ====="
            kubectl get events --sort-by=.lastTimestamp || true

            exit 1
          fi

          echo "===== FRONTEND DEPLOYMENT SUCCESSFUL ====="
          kubectl get pods -l app=frontend -o wide

          echo "===== FRONTEND SERVICE ====="
          kubectl get svc frontend